# /etc/nginx/sites-available/blog-tunnel (replace example.com before installation)
# Only cloudflared on this VPS can reach this HTTP origin.
limit_req_zone $binary_remote_addr zone=cms_login:1m rate=10r/m;

server {
    listen 127.0.0.1:8080;
    server_name example.com;
    root /opt/blog/dist;
    index index.html;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Cloudflare sets this header to the visitor's scheme. Never serve CMS over HTTP.
    if ($http_x_forwarded_proto != https) { return 301 https://$host$request_uri; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/rss+xml text/xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 30d;
        access_log off;
    }

    # CMS: login handled by the app (auth.js). nginx adds brute-force throttling on login.
    location = /admin/login {
        limit_req zone=cms_login burst=5 nodelay;
        limit_req_status 429;
        include /opt/blog/deploy/proxy-cms.conf;
    }

    location /admin/ {
        client_max_body_size 1m;
        include /opt/blog/deploy/proxy-cms.conf;
    }
}
